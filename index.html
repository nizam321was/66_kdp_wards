function nums(s){return (String(s).match(/\d+/g)||[]).map(Number)}
function hit(q,r){
 const Q=nums(q),A=nums(r.from),B=nums(r.to);
 if(!Q.length||!A.length||!B.length||Q[0]!==A[0]||Q[0]!==B[0])return false;
 const T=Q.slice(1),F=A.slice(1),E=B.slice(1),n=Math.max(T.length,F.length,E.length);
 while(T.length<n)T.push(0);while(F.length<n)F.push(0);while(E.length<n)E.push(0);
 return F.every((v,i)=>v<=T[i])&&T.every((v,i)=>v<=E[i]);
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function areaNorm(s){return String(s||"").toLowerCase().replace(/\s+/g," ").trim()}
const door=document.getElementById("door"),div=document.getElementById("div"),area=document.getElementById("area");
const dr=document.getElementById("dr"),vr=document.getElementById("vr"),ar=document.getElementById("ar");
door.addEventListener("input",()=>{const q=door.value.trim();if(!q){dr.className="out muted";dr.textContent="Enter door number";return}
 const rs=DATA.filter(r=>hit(q,r));if(!rs.length){dr.className="out err";dr.textContent="No matching range found";return}
 dr.className="out";dr.innerHTML=rs.map(r=>`<div class="grid"><span class="k">DIVISION</span><span class="v">${esc(r.division)}</span><span class="k">AREA</span><span>${esc(r.area)}</span></div><div class="range">Range: ${esc(r.from)} → ${esc(r.to)}</div>`).join("<hr>")});
div.addEventListener("input",()=>{const q=div.value.trim();if(!q){vr.className="out muted";vr.textContent="Enter division number";return}
 const rs=DATA.filter(r=>r.division===q);if(!rs.length){vr.className="out err";vr.textContent="Division not found";return}
 vr.className="out";vr.innerHTML=`<div class="count">${rs.length} range(s)</div><div class="scroll"><table><tr><th>FROM</th><th>TO</th><th>AREA</th></tr>${rs.map(r=>`<tr><td>${esc(r.from)}</td><td>${esc(r.to)}</td><td>${esc(r.area)}</td></tr>`).join("")}</table></div>`});
area.addEventListener("input",()=>{const q=areaNorm(area.value);if(!q){ar.className="out muted";ar.textContent="Enter area name";return}
 const matched=DATA.filter(r=>areaNorm(r.area).includes(q));if(!matched.length){ar.className="out err";ar.textContent="No matching area found";return}
 const groups=new Map();for(const r of matched){const k=areaNorm(r.area);if(!groups.has(k))groups.set(k,{name:r.area,ranges:[]});groups.get(k).ranges.push(r)}
 ar.className="out";ar.innerHTML=`<div class="count">${groups.size} area name(s) found</div><div class="scroll">${Array.from(groups.values()).map(g=>`<div class="areaName">${esc(g.name)}</div><table><tr><th>DIV.</th><th>FROM</th><th>TO</th></tr>${g.ranges.map(r=>`<tr><td>${esc(r.division)}</td><td>${esc(r.from)}</td><td>${esc(r.to)}</td></tr>`).join("")}</table><hr>`).join("")}</div>`});
document.getElementById("clearAll").addEventListener("click",()=>{door.value="";div.value="";area.value="";dr.className="out muted";dr.textContent="Enter door number";vr.className="out muted";vr.textContent="Enter division number";ar.className="out muted";ar.textContent="Enter area name"});
