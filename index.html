/* Door number ordering:
   prefix/base/suffix are hierarchical.
   Example: 16/100-1-2-1 is greater than 16/100,
   but still less than 16/101, so it belongs to 16/99 → 16/101.
   Different prefixes are also allowed for ranges such as 72/... → 73/....
*/
function parseDoor(s){
  const m=String(s).trim().match(/^(\d+)\s*[\/\-]\s*(\d+)(.*)$/);
  if(!m)return null;
  return {
    prefix:Number(m[1]),
    base:Number(m[2]),
    suffix:(m[3].match(/\d+/g)||[]).map(Number)
  };
}
function cmpSuffix(a,b){
  const n=Math.max(a.length,b.length);
  for(let i=0;i<n;i++){
    const x=a[i]===undefined?0:a[i], y=b[i]===undefined?0:b[i];
    if(x!==y)return x<y?-1:1;
  }
  return 0;
}
function cmpDoor(a,b){
  const A=parseDoor(a),B=parseDoor(b);
  if(!A||!B)return null;
  if(A.prefix!==B.prefix)return A.prefix<B.prefix?-1:1;
  if(A.base!==B.base)return A.base<B.base?-1:1;
  return cmpSuffix(A.suffix,B.suffix);
}
function hit(q,r){
  const Q=parseDoor(q),F=parseDoor(r.from),T=parseDoor(r.to);
  if(!Q||!F||!T)return false;
  return cmpDoor(r.from,q)<=0 && cmpDoor(q,r.to)<=0;
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function areaNorm(s){return String(s||"").toLowerCase().replace(/\s+/g," ").trim()}

door.addEventListener("input",()=>{

  const oldHits=OLD_DATA.filter(r=>hit(q,r));

  if(!oldHits.length&&!newHits.length){dr.className="out err";dr.textContent="No matching door range found";return}

area.addEventListener("input",()=>{

    const sec=OLD_SECRETARY_MAP.get(r.ward);
    const areaMatch=areaNorm(r.area).includes(q);
    const secMatch=sec && secText(sec).includes(q);
    if(!areaMatch && !secMatch) continue;
    const key=r.ward;
    if(!oldGroups.has(key))oldGroups.set(key,{ward:r.ward,area:r.area,ranges:[],sec,secMatch});
    const g=oldGroups.get(key);
    if(secMatch)g.secMatch=true;
    const rk=r.from+"|"+r.to+"|"+r.area;
    if(!g.ranges.some(x=>x.from+"|"+x.to+"|"+x.area===rk))g.ranges.push(r);
  }

  // If a secretary exists but has no OLD range row in the current data,
  // still show the secretary once.
  for(const [key,sec] of OLD_SECRETARY_MAP){
    if(secText(sec).includes(q) && !oldGroups.has(key)){
      oldGroups.set(key,{ward:key,area:"",ranges:[],sec,secMatch:true});
    }
  }

  const newGroups=new Map();
  for(const r of NEW_DATA){
    if(!areaNorm(r.area).includes(q))continue;
    const key=r.division+"|"+areaNorm(r.area);
    if(!newGroups.has(key))newGroups.set(key,{division:r.division,name:r.area,ranges:[]});
    const g=newGroups.get(key);
    const rk=r.from+"|"+r.to;
    if(!g.ranges.some(x=>x.from+"|"+x.to===rk))g.ranges.push(r);
  }

  if(!oldGroups.size&&!newGroups.size){ar.className="out err";ar.textContent="No matching area or secretary found";return}
  ar.className="out";

  // Compact OLD secretary summary: no full 11-row secretary table here.
  // Full details remain available through the Old Division / Secretariat search.
  const oldHtml=Array.from(oldGroups.values()).map(g=>{
    const sec=g.sec;
    const matchedRole=sec?[
      ["SECRETARIAT",sec.name,""],["SPECIAL OFFICER",sec.special,sec.specialPhone],["ADMIN SECRETARY",sec.admin,sec.adminPhone],
      ["EDUCATION",sec.education,sec.educationPhone],["WELFARE",sec.welfare,sec.welfarePhone],["WOMEN PROTECTION",sec.women,sec.womenPhone],
      ["AMENITIES",sec.amenities,sec.amenitiesPhone],["PLANNING",sec.planning,sec.planningPhone],["SANITATION",sec.sanitation,sec.sanitationPhone],
      ["HEALTH",sec.health,sec.healthPhone],["REVENUE",sec.revenue,sec.revenuePhone]
    ].find(([k,v])=>areaNorm(v).includes(q)):null;
    const title=sec?`<div class="tag">OLD DIVISION ${esc(g.ward)}</div>`:`<div class="tag">OLD DIVISION ${esc(g.ward)}</div>`;
    const summary=sec?`<div class="compactSec">
      <div><b>SECRETARIAT:</b> ${esc(sec.name)}</div>
      ${matchedRole && areaNorm(matchedRole[1]).includes(q) && matchedRole[0]!=="SECRETARIAT" ? `<div><b>${esc(matchedRole[0])}:</b> ${esc(matchedRole[1])}${matchedRole[2]?` · ${esc(matchedRole[2])}`:""}</div>` : ""}
      ${g.area?`<div><b>AREA:</b> ${esc(g.area)}</div>`:""}
      ${g.ranges.length?`<div><b>RANGES:</b> ${g.ranges.length}</div>`:""}
    </div>`:"";
    const ranges=g.ranges.length?`<div class="compactRanges">${g.ranges.map(r=>`<span>${esc(r.from)} → ${esc(r.to)}</span>`).join("")}</div>`:"";
    return `<div class="divbox">${title}${summary}${ranges}</div>`;
  }).join("");

  const newHtml=Array.from(newGroups.values()).map(g=>`<div class="divbox"><div class="areaName"><span class="tag">NEW DIVISION ${esc(g.division)}</span> ${esc(g.name)}</div>
    <div class="compactRanges">${g.ranges.map(r=>`<span>${esc(r.from)} → ${esc(r.to)}</span>`).join("")}</div>
  </div>`).join("");

  ar.innerHTML=`<div class="count">${oldGroups.size} OLD result(s) • ${newGroups.size} NEW area group(s)</div>${oldHtml}${newHtml}`;
});

function clearAll(){
  [door,div,oldDiv,area].forEach(el=>el.value="");
  dr.className="out muted";dr.textContent="Enter door number";
  vr.className="out muted";vr.textContent="Enter new division number";
  ovr.className="out muted";ovr.textContent="Enter old division / secretariat number";
  ar.className="out muted";ar.textContent="Enter area name";
}
document.getElementById("clearAll").addEventListener("click",clearAll);

document.querySelectorAll("[data-clear]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const id=btn.dataset.clear;
    document.getElementById(id).value="";
    const box=id==="door"?dr:id==="div"?vr:id==="oldDiv"?ovr:ar;
    box.className="out muted";
    box.textContent=id==="door"?"Enter door number":id==="div"?"Enter new division number":id==="oldDiv"?"Enter old division / secretariat number":"Enter area name";
  });
});
</script>
