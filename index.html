/*
 Door matching:
 - First number before "/" must match.
 - Main number immediately after "/" is compared numerically.
 - Suffixes (-1-2-1 etc.) are considered only when the query and
   a range endpoint have the same main number.
 This means 16/100-1-2-1 correctly falls between 16/99 and 16/101.
*/
function parseDoor(s){
  const m=String(s).trim().match(/^(\d+)\s*\/\s*(\d+)(.*)$/);
  if(!m)return null;
  const suffix=(m[3]||"").match(/\d+/g)||[];
  return {prefix:Number(m[1]),base:Number(m[2]),suffix:suffix.map(Number)};
}
function cmpArr(a,b){
  const n=Math.max(a.length,b.length);
  for(let i=0;i<n;i++){
    const x=a[i]||0,y=b[i]||0;
    if(x!==y)return x<y?-1:1;
  }
  return 0;
}
function cmpDoor(a,b){
  const A=parseDoor(a),B=parseDoor(b);
  if(!A||!B)return null;
  if(A.prefix!==B.prefix)return A.prefix<B.prefix?-1:1;
  if(A.base!==B.base)return A.base<B.base?-1:1;
  return cmpArr(A.suffix,B.suffix);
}
function hit(q,r){
  const Q=parseDoor(q),F=parseDoor(r.from),T=parseDoor(r.to);
  if(!Q||!F||!T)return false;
  if(Q.prefix!==F.prefix||Q.prefix!==T.prefix)return false;
  return cmpDoor(r.from,q)<=0 && cmpDoor(q,r.to)<=0;
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function areaNorm(s){return String(s||"").toLowerCase().replace(/\s+/g," ").trim()}

const door=document.getElementById("door"),dr=document.getElementById("dr");
const div=document.getElementById("div"),vr=document.getElementById("vr");
const area=document.getElementById("area"),ar=document.getElementById("ar");

door.addEventListener("input",()=>{
  const q=door.value.trim();
  if(!q){dr.className="out muted";dr.textContent="Enter door number";return}
  const oldHits=OLD_DATA.filter(r=>hit(q,r));
  const newHits=NEW_DATA.filter(r=>hit(q,r));
  if(!oldHits.length&&!newHits.length){
    dr.className="out err";dr.textContent="No matching door range found";return;
  }
  const block=(title,rows)=>rows.length?`
    <div class="divbox"><div class="tag">${title}</div>
    ${rows.map(r=>`<div class="grid">
      <span class="k">DIVISION</span><span class="v">${esc(r.division)}</span>
      <span class="k">AREA</span><span>${esc(r.area)}</span>
    </div><div class="range">Range: ${esc(r.from)} → ${esc(r.to)}</div>`).join("<hr>")}
    </div>`:"";
  dr.className="out";
  dr.innerHTML=block("OLD DIVISION",oldHits)+block("NEW DIVISION",newHits);
});

div.addEventListener("input",()=>{
  const q=div.value.trim();
  if(!q){vr.className="out muted";vr.textContent="Enter new division number";return}
  const rs=NEW_DATA.filter(r=>r.division===q);
  if(!rs.length){vr.className="out err";vr.textContent="New division not found";return}
  vr.className="out";
  vr.innerHTML=`<div class="count">${rs.length} range(s)</div>
  <div class="scroll"><table><tr><th>FROM</th><th>TO</th><th>AREA</th></tr>
  ${rs.map(r=>`<tr><td>${esc(r.from)}</td><td>${esc(r.to)}</td><td>${esc(r.area)}</td></tr>`).join("")}</table></div>`;
});

area.addEventListener("input",()=>{
  const q=areaNorm(area.value);
  if(!q){ar.className="out muted";ar.textContent="Enter area name";return}
  const all=[...OLD_DATA.map(r=>({...r,type:"OLD"})),...NEW_DATA.map(r=>({...r,type:"NEW"}))];
  const matched=all.filter(r=>areaNorm(r.area).includes(q));
  if(!matched.length){ar.className="out err";ar.textContent="No matching area found";return}
  const groups=new Map();
  for(const r of matched){
    const key=r.type+"|"+areaNorm(r.area);
    if(!groups.has(key))groups.set(key,{type:r.type,name:r.area,ranges:[]});
    groups.get(key).ranges.push(r);
  }
  ar.className="out";
  ar.innerHTML=`<div class="count">${groups.size} area group(s) found</div>
  <div class="scroll">${Array.from(groups.values()).map(g=>`
    <div class="areaName">${esc(g.name)} <span class="tag">${g.type}</span></div>
    <table><tr><th>DIV.</th><th>FROM</th><th>TO</th></tr>
    ${g.ranges.map(r=>`<tr><td>${esc(r.division)}</td><td>${esc(r.from)}</td><td>${esc(r.to)}</td></tr>`).join("")}</table><hr>`).join("")}</div>`;
});

document.querySelectorAll("[data-clear]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const id=btn.dataset.clear;
    document.getElementById(id).value="";
    const box=id==="door"?dr:id==="div"?vr:ar;
    box.className="out muted";
    box.textContent=id==="door"?"Enter door number":id==="div"?"Enter new division number":"Enter area name";
    // No focus() — cursor does not jump into any field.
  });
});
